name: 🐳 Build Docker Image

on:
  # Запуск при создании issue с лейблом "update-available"
  issues:
    types: [opened, labeled]
  
  # Ручной запуск
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (optional)'
        required: false
        type: string

jobs:
  build-image:
    name: 🐳 Build and Push Docker Image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && 
       (github.event.action == 'opened' || github.event.action == 'labeled') &&
       contains(github.event.issue.labels.*.name, 'update-available'))
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🔍 Get Version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          # Извлекаем версию из названия issue
          VERSION=$(echo "${{ github.event.issue.title }}" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
        fi
        
        if [ -z "$VERSION" ]; then
          echo "❌ Could not determine version"
          exit 1
        fi
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "🔍 Building version: $VERSION"
    
    - name: 🔧 Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🔐 Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: 🐳 Build and Push Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/freqtrade:${{ steps.version.outputs.version }}
          ${{ secrets.DOCKER_USERNAME }}/freqtrade:stable
        labels: |
          version=${{ steps.version.outputs.version }}
          build-date=${{ github.run_number }}
          source=github-actions
    
    - name: 📝 Update Version File
      run: |
        echo "${{ steps.version.outputs.version }}" > .version
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .version
        git commit -m "📝 Update version to ${{ steps.version.outputs.version }}" || echo "No changes to commit"
        git push || echo "Nothing to push"
    
    - name: ✅ Comment on Issue
      if: github.event_name == 'issues'
      uses: actions/github-script@v7
      with:
        script: |
          const version = '${{ steps.version.outputs.version }}';
          const comment = `
          ## ✅ Docker Image Built Successfully!
          
          **Version:** \`${version}\`
          **Image:** \`${{ secrets.DOCKER_USERNAME }}/freqtrade:${version}\`
          **Build:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ### Next Steps:
          - [ ] Update Helm chart with new image tag
          - [ ] Deploy to Kubernetes via ArgoCD
          
          ---
          *This comment was automatically created by the build workflow.*
          `;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: comment
          });
