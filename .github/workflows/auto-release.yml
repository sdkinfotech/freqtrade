name: 🚀 Auto Release Pipeline

on:
  # Запуск при создании релиза
  release:
    types: [published]
  
  # Запуск по расписанию (каждый день в 9:00 UTC)
  schedule:
    - cron: '0 9 * * *'
  
  # Ручной запуск
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to check (optional)'
        required: false
        type: string

jobs:
  check-version:
    name: 🔍 Check for New Version
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.check.outputs.version }}
      has-update: ${{ steps.check.outputs.has-update }}
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🔍 Check Latest Release
      id: check
      run: |
        # Проверяем последний релиз freqtrade
        LATEST_VERSION=$(curl -s https://api.github.com/repos/freqtrade/freqtrade/releases/latest | jq -r '.tag_name')
        CURRENT_VERSION=$(cat .version || echo "unknown")
        
        echo "Latest version: $LATEST_VERSION"
        echo "Current version: $CURRENT_VERSION"
        
        if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "has-update=true" >> $GITHUB_OUTPUT
          echo "🆕 New version found: $LATEST_VERSION"
        else
          echo "has-update=false" >> $GITHUB_OUTPUT
          echo "✅ Already up to date"
        fi

  build-image:
    name: 🐳 Build Docker Image
    needs: check-version
    if: needs.check-version.outputs.has-update == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🔐 Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: 🐳 Build and Push Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/freqtrade:${{ needs.check-version.outputs.new-version }}
          ${{ secrets.DOCKER_USERNAME }}/freqtrade:stable
        labels: |
          version=${{ needs.check-version.outputs.new-version }}
          build-date=${{ github.run_number }}

  update-helm:
    name: 📦 Update Helm Chart
    needs: [check-version, build-image]
    if: needs.check-version.outputs.has-update == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Helm Charts
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/helm-charts
        token: ${{ secrets.GITHUB_TOKEN }}
        path: helm-charts
    
    - name: 🔄 Update Chart Version
      run: |
        cd helm-charts
        # Обновляем версию в Chart.yaml
        sed -i "s/version: .*/version: ${{ needs.check-version.outputs.new-version }}/" charts/freqtrade/Chart.yaml
        sed -i "s/appVersion: .*/appVersion: ${{ needs.check-version.outputs.new-version }}/" charts/freqtrade/Chart.yaml
        
        # Обновляем образ в values.yaml
        sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/freqtrade:${{ needs.check-version.outputs.new-version }}|" charts/freqtrade/values.yaml
    
    - name: 📝 Commit Changes
      run: |
        cd helm-charts
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add charts/freqtrade/Chart.yaml charts/freqtrade/values.yaml
        git commit -m "🚀 Update freqtrade to ${{ needs.check-version.outputs.new-version }}"
        git push
    
    - name: 🔔 Notify ArgoCD
      run: |
        # Отправляем webhook в ArgoCD для обновления
        curl -X POST "${{ secrets.ARGOCD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{"version": "${{ needs.check-version.outputs.new-version }}"}'

  update-source-version:
    name: 📝 Update Source Version
    needs: [check-version, build-image, update-helm]
    if: needs.check-version.outputs.has-update == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 📝 Update Version File
      run: |
        echo "${{ needs.check-version.outputs.new-version }}" > .version
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .version
        git commit -m "📝 Update version to ${{ needs.check-version.outputs.new-version }}"
        git push
